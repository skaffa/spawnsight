plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	splitEnvironmentSourceSets()

	runs {
		client {
			// Keep the dev game small enough for 8 GB machines.
			vmArgs "-Xms256M", "-Xmx2G"
			// ./gradlew runClient -Pselftest=<mode>: scripted in-game test (PLAN.md §10)
			if (project.hasProperty("selftest")) {
				property "spawnsight.selftest", project.property("selftest").toString()
			}
			// ./gradlew runClient -Pjfr: Java Flight Recorder profile to run/spawnsight.jfr
			if (project.hasProperty("jfr")) {
				vmArgs "-XX:StartFlightRecording=filename=spawnsight.jfr,settings=profile"
			}
		}
		server {
			// Separate folder so the test server does not share worlds or configs with the client.
			runDir "run-server"
			vmArgs "-Xms256M", "-Xmx1G"
		}
	}

	mods {
		"spawnsight" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

repositories {
	maven {
		name = 'Terraformers'
		url = 'https://maven.terraformersmc.com/releases/'
		content {
			includeGroup 'com.terraformersmc'
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Optional: "Configure" button in Mod Menu. Not bundled; also loaded in the dev client.
	clientCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"

	// Core (src/main/java/dev/spawnsight/core) never imports Minecraft classes, so it is tested with plain JUnit.
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// Vanilla spawn tables for servers (PLAN.md §7): read from the 26.3 game jar's built-in data pack by
// core.table.SpawnTableBuilder (Minecraft-free core code, so it runs right after compileJava).
def spawnTableDir = layout.buildDirectory.dir("generated/spawntable")
def spawnTableFile = spawnTableDir.map { it.file("spawnsight/spawn_table.json") }
def minecraftJar = sourceSets.main.compileClasspath.filter { it.name.startsWith("minecraft-common") && !it.name.contains("sources") }
def mcVersion = project.minecraft_version
def genSpawnTable = tasks.register("genSpawnTable", JavaExec) {
	dependsOn tasks.named("compileJava")
	classpath = files(sourceSets.main.java.classesDirectory) + sourceSets.main.compileClasspath
	mainClass = "dev.spawnsight.core.table.SpawnTableBuilder"
	inputs.files(minecraftJar)
	outputs.dir(spawnTableDir)
	argumentProviders.add({ [minecraftJar.singleFile.absolutePath, spawnTableFile.get().asFile.absolutePath, mcVersion] } as CommandLineArgumentProvider)
}

processResources {
	from(genSpawnTable)
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

test {
	useJUnitPlatform()
	// Minecraft's logger writes logs/ into the working directory; keep it out of the project root
	def testDir = layout.buildDirectory.dir("test-run").get().asFile
	workingDir = testDir
	doFirst { testDir.mkdirs() }
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}
